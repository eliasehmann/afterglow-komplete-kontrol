[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kkleds"
version = "0.1.0"
description = "Customise the light guide and button LEDs of a Native Instruments Komplete Kontrol S88 MK2"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
kkleds = "kkleds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
