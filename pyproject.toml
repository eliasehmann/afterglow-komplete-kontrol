[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kkleds"
version = "0.2.0"
description = "Customise the light guide and button LEDs of Native Instruments keyboards, driven by device profiles"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
kkleds = "kkleds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kkleds = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
